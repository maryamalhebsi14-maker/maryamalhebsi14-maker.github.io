<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102845">
  <title>بوابة متابعة مواد الأنشطة | مدرسة الباهية المشتركة</title>
  <style>
    :root {
      --navy: #102845;
      --navy-2: #173b63;
      --gold: #c9a552;
      --gold-soft: #ead9a8;
      --paper: #f6f3ed;
      --white: #ffffff;
      --ink: #172438;
      --muted: #667085;
      --line: #e5dfd3;
      --success: #19765a;
      --shadow: 0 14px 38px rgba(16, 40, 69, .11);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Tahoma, "Segoe UI", Arial, sans-serif;
      line-height: 1.7;
    }
    button, input { font: inherit; }
    a { color: inherit; text-decoration: none; }

    .app-shell { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 0 0 auto;
      width: 292px;
      padding: 26px 18px;
      overflow-y: auto;
      color: var(--white);
      background:
        radial-gradient(circle at 10% 5%, rgba(201,165,82,.22), transparent 26%),
        linear-gradient(155deg, #173b63 0%, #102845 55%, #0a1d33 100%);
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 22px;
      border-bottom: 1px solid rgba(255,255,255,.15);
    }
    .brand-mark {
      width: 48px; height: 48px; border-radius: 16px;
      display: grid; place-items: center;
      color: var(--navy); background: var(--gold);
      font-weight: 900; font-size: 19px;
      box-shadow: 0 9px 24px rgba(0,0,0,.18);
    }
    .brand strong { display: block; font-size: 15px; }
    .brand small { color: #dce6f1; font-size: 11px; }
    .nav-label { margin: 22px 11px 8px; color: var(--gold-soft); font-size: 11px; letter-spacing: .04em; }
    .nav-list { display: grid; gap: 6px; }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 12px;
      color: #eaf0f7; font-size: 12px;
      transition: .2s ease;
    }
    .nav-link:hover, .nav-link.active { background: rgba(255,255,255,.11); color: #fff; transform: translateX(-2px); }
    .nav-code { color: var(--gold); font-weight: 800; min-width: 24px; }
    .side-note {
      margin-top: 20px; padding: 14px;
      border: 1px solid rgba(201,165,82,.35); border-radius: 16px;
      color: #eaf0f7; background: rgba(255,255,255,.06); font-size: 11px;
    }

    main { margin-right: 292px; padding: 34px clamp(22px, 4vw, 58px) 60px; }
    .mobile-bar { display: none; }
    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(30px, 5vw, 56px);
      border-radius: 30px;
      color: var(--white);
      background: linear-gradient(120deg, #102845 0%, #173b63 68%, #1e4b7b 100%);
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: ""; position: absolute; width: 270px; height: 270px;
      left: -95px; top: -85px; border: 28px solid rgba(201,165,82,.18); border-radius: 50%;
    }
    .eyebrow { color: var(--gold-soft); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .hero h1 { position: relative; margin: 8px 0 12px; max-width: 780px; font-size: clamp(28px, 4vw, 48px); line-height: 1.3; }
    .hero p { position: relative; max-width: 720px; margin: 0; color: #dfe8f2; font-size: 14px; }
    .hero-meta { position: relative; display: flex; flex-wrap: wrap; gap: 9px; margin-top: 24px; }
    .hero-pill { padding: 7px 13px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; background: rgba(255,255,255,.08); font-size: 11px; }
    .open-notice {
      display: flex; align-items: center; gap: 12px;
      margin: 18px 0 0; padding: 13px 16px;
      border: 1px solid #e4cd91; border-radius: 16px;
      color: #5f512f; background: #fff8e8; font-size: 11px;
    }
    .open-notice strong { color: var(--navy); }

    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 18px 0 26px; }
    .stat { padding: 17px 19px; border: 1px solid var(--line); border-radius: 18px; background: var(--white); box-shadow: 0 7px 20px rgba(16,40,69,.06); }
    .stat strong { display: block; color: var(--navy); font-size: 27px; line-height: 1.2; }
    .stat span { color: var(--muted); font-size: 11px; }

    .toolbar {
      position: sticky; top: 14px; z-index: 10;
      display: flex; gap: 10px; align-items: center;
      padding: 12px; margin-bottom: 22px;
      border: 1px solid rgba(229,223,211,.9); border-radius: 18px;
      background: rgba(246,243,237,.92); backdrop-filter: blur(12px);
    }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap span { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    #search {
      width: 100%; padding: 12px 44px 12px 14px;
      border: 1px solid var(--line); outline: none; border-radius: 13px; background: #fff;
    }
    #search:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,165,82,.16); }
    .toolbar-btn { border: 0; padding: 11px 15px; border-radius: 12px; color: #fff; background: var(--navy); cursor: pointer; }

    .section { scroll-margin-top: 100px; margin: 34px 0 46px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
    .section-kicker { color: var(--gold); font-weight: 900; font-size: 12px; }
    .section h2 { margin: 2px 0 3px; color: var(--navy); font-size: clamp(20px, 2.5vw, 28px); }
    .section-desc { margin: 0; color: var(--muted); font-size: 12px; }
    .count-badge { white-space: nowrap; padding: 6px 11px; border-radius: 999px; color: var(--navy); background: #eee4ca; font-size: 11px; font-weight: 700; }
    .privacy {
      display: flex; gap: 10px; align-items: start;
      margin: 12px 0 16px; padding: 12px 15px;
      border-right: 4px solid var(--gold); border-radius: 12px;
      color: #66552e; background: #fff8e8; font-size: 11px;
    }

    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .file-card {
      display: flex; flex-direction: column; min-height: 205px;
      padding: 18px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--white); box-shadow: 0 8px 24px rgba(16,40,69,.055);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .file-card:hover { transform: translateY(-3px); border-color: #d5bd7f; box-shadow: var(--shadow); }
    .file-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .file-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: #edf2f7; font-size: 20px; }
    .file-type { color: var(--success); font-size: 10px; font-weight: 800; }
    .file-card h3 { margin: 14px 0 7px; color: var(--navy); font-size: 15px; line-height: 1.55; }
    .file-card p { margin: 0 0 15px; color: var(--muted); font-size: 11px; }
    .file-actions { display: flex; gap: 8px; margin-top: auto; }
    .action { flex: 1; padding: 8px 10px; border-radius: 10px; text-align: center; font-size: 11px; font-weight: 700; }
    button.action { border: 0; cursor: pointer; }
    .action.primary { color: #fff; background: var(--navy); }
    .action.secondary { border: 1px solid var(--line); color: var(--navy); background: #fff; }
    .action:hover { filter: brightness(1.06); }

    .placeholder-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .placeholder {
      padding: 15px; border: 1px dashed #c9b782; border-radius: 16px;
      color: #5d5135; background: rgba(255,255,255,.55); font-size: 11px;
    }
    .placeholder strong { display: block; color: var(--navy); font-size: 13px; margin-bottom: 3px; }
    .teachers { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .teacher { padding: 6px 10px; border-radius: 999px; color: var(--navy); background: #e8edf3; font-size: 10px; }
    .empty { display: none; padding: 38px; text-align: center; color: var(--muted); }
    footer { margin-top: 50px; padding: 24px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; text-align: center; }
    .viewer {
      position: fixed; inset: 0; z-index: 100;
      display: none; align-items: center; justify-content: center;
      padding: 18px; background: rgba(5, 17, 31, .82); backdrop-filter: blur(8px);
    }
    .viewer.open { display: flex; }
    .viewer-box {
      width: min(1160px, 96vw); height: min(900px, 94vh);
      display: flex; flex-direction: column; overflow: hidden;
      border-radius: 20px; background: #fff; box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .viewer-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 16px; color: #fff; background: var(--navy); }
    .viewer-head strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .viewer-close { border: 1px solid rgba(255,255,255,.28); border-radius: 10px; padding: 7px 12px; color: #fff; background: rgba(255,255,255,.1); cursor: pointer; }
    .viewer iframe { flex: 1; width: 100%; border: 0; background: #e7eaf0; }

    @media (max-width: 1100px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .placeholder-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .sidebar { transform: translateX(105%); transition: .25s ease; }
      .sidebar.open { transform: translateX(0); }
      main { margin-right: 0; padding: 20px 15px 45px; }
      .mobile-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      .menu-btn { border: 0; border-radius: 11px; padding: 9px 13px; color: #fff; background: var(--navy); }
      .toolbar { top: 8px; }
    }
    @media (max-width: 570px) {
      .cards, .stats, .placeholder-grid { grid-template-columns: 1fr; }
      .toolbar-btn { display: none; }
      .hero { border-radius: 22px; }
      .section-head { align-items: start; }
    }
    @media print {
      .sidebar, .toolbar, .mobile-bar, .file-actions { display: none !important; }
      main { margin: 0; padding: 0; }
      .hero { box-shadow: none; }
      .file-card { break-inside: avoid; box-shadow: none; }
    }
  
    .hero-top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .lang-toggle { position: relative; z-index: 2; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 8px 15px; color: #fff; background: rgba(255,255,255,.1); cursor: pointer; font-weight: 700; }
    .lang-toggle:hover { background: rgba(255,255,255,.18); }
    .leadership { margin: 20px 0 0; padding: 22px; border: 1px solid var(--line); border-radius: 24px; background: #fff; box-shadow: 0 8px 24px rgba(16,40,69,.06); }
    .leadership-head { margin-bottom: 14px; }
    .leadership-head h2 { margin: 0; color: var(--navy); font-size: 20px; }
    .leadership-head p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .leadership-grid { display: grid; grid-template-columns: 1.2fr repeat(3, 1fr); gap: 10px; }
    .leader-card { min-height: 112px; padding: 15px; border: 1px solid var(--line); border-radius: 16px; background: #faf9f6; }
    .leader-card.director { color: #fff; border-color: var(--navy); background: linear-gradient(135deg, var(--navy), var(--navy-2)); }
    .leader-role { display: block; color: var(--gold); font-size: 10px; font-weight: 900; }
    .leader-card strong { display: block; margin: 5px 0 6px; font-size: 14px; }
    .leader-cycle { color: var(--muted); font-size: 10px; }
    .director .leader-cycle { color: #dfe8f2; }
    .coordinator-card { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 13px 16px; border-right: 4px solid var(--gold); border-radius: 14px; background: #f7f0de; }
    .coordinator-card .leader-role { color: #8d6d1d; }
    .coordinator-card strong { color: var(--navy); }
    [dir="ltr"] .sidebar { inset: 0 auto 0 0; }
    [dir="ltr"] main { margin-right: 0; margin-left: 292px; }
    [dir="ltr"] .nav-link:hover, [dir="ltr"] .nav-link.active { transform: translateX(2px); }
    [dir="ltr"] .search-wrap span { right: auto; left: 15px; }
    [dir="ltr"] #search { padding: 12px 14px 12px 44px; }
    [dir="ltr"] .privacy { border-right: 0; border-left: 4px solid var(--gold); }
    [dir="ltr"] .coordinator-card { border-right: 0; border-left: 4px solid var(--gold); }
    @media (max-width: 1100px) { .leadership-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 820px) { [dir="ltr"] .sidebar { transform: translateX(-105%); } [dir="ltr"] .sidebar.open { transform: translateX(0); } [dir="ltr"] main { margin-left: 0; } }
    @media (max-width: 570px) { .leadership-grid { grid-template-columns: 1fr; } .hero-top { align-items: flex-start; } }

    search.addEventListener("input", e => render(e.target.value));
    document.getElementById("languageToggle").addEventListener("click", switchLanguage);
    document.addEventListener("click", e => { const action=e.target.closest("[data-action]"); if (!action) return; if (action.dataset.action === "preview") openPreview(action.dataset.key, action.dataset.title); if (action.dataset.action === "download") downloadEmbedded(action.dataset.key, action.dataset.filename); });
    document.getElementById("viewerClose").addEventListener("click", closePreview);
    viewer.addEventListener("click", e => { if (e.target === viewer) closePreview(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closePreview(); });
    document.getElementById("menuBtn").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
    document.addEventListener("click", e => { if (e.target.closest(".nav-link") && innerWidth <= 820) document.getElementById("sidebar").classList.remove("open"); });
    applyStaticTranslations(); renderNav(); render();
  </script>
</body>

</html>
